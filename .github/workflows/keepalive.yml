name: keepalive

# /health queries the database, so this daily call counts as Supabase activity:
# a Free project pauses after a week without any (ADR 0010, 0017).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health
        run: curl --fail --silent --show-error --max-time 30 --retry 3 --retry-all-errors https://stock-flow-api-ten.vercel.app/health
