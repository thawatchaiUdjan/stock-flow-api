name: deploy

# Runs when ci.yml finishes on a push to main, and deploys only if it passed.
# Vercel's Git auto-deploy is off (vercel.json), so this is the only way to production.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Before the deploy, never at process startup: every Vercel instance runs main().
      # The session pooler, because goose holds a session lock and runners have no IPv6.
      - name: Migrate the database
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: go tool goose -dir db/migrations postgres "$MIGRATION_DATABASE_URL" up

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.11.0 deploy --prod --yes --token="$VERCEL_TOKEN"
