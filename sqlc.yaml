version: "2"
sql:
  - engine: postgresql
    # The goose migrations are the schema: sqlc reads their Up sections.
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        overrides:
          - db_type: timestamptz
            go_type: time.Time
